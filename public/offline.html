<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Maitri — ไม่มีสัญญาณอินเทอร์เน็ต</title>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;
      background:#faf7f2;color:#2a2522;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;}
    @media(prefers-color-scheme:dark){body{background:#0d0a08;color:#f0ebe4;}}
    .card{
      max-width:400px;width:calc(100% - 48px);padding:40px 36px;text-align:center;
      background:#fff;border:1px solid #ede5dc;border-radius:28px;
      box-shadow:0 24px 80px rgba(45,28,12,.10);}
    @media(prefers-color-scheme:dark){.card{background:#1c1410;border-color:#3a2a1c;}}
    .icon{
      width:72px;height:72px;border-radius:24px;
      background:linear-gradient(135deg,#f5e6d8,#faf7f2);
      display:inline-flex;align-items:center;justify-content:center;
      margin-bottom:20px;border:1px solid #e8d5bf;}
    @media(prefers-color-scheme:dark){.icon{background:linear-gradient(135deg,#3a2010,#2a1808);border-color:#5a3520;}}
    .icon svg{width:32px;height:32px}
    h1{margin:0 0 10px;font-size:22px;font-weight:700;letter-spacing:-.3px;}
    p{margin:0 0 28px;font-size:15px;line-height:1.65;color:#6b5b4d;max-width:300px;margin-left:auto;margin-right:auto;}
    @media(prefers-color-scheme:dark){p{color:#9a8070;}}
    .btn{
      display:inline-block;padding:14px 32px;
      background:#c66a30;color:#fff;font-size:15px;font-weight:700;
      border:0;border-radius:100px;cursor:pointer;
      box-shadow:0 8px 24px rgba(198,106,48,.30);
      transition:background .15s,transform .1s,box-shadow .15s;}
    .btn:active{transform:scale(.97);box-shadow:0 4px 12px rgba(198,106,48,.25);}
    .hint{margin-top:20px;font-size:12px;color:#9a8878;line-height:1.5;}
    @media(prefers-color-scheme:dark){.hint{color:#6a5545;}}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c66a30" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 6s2.5-3 11-3 11 3 11 3"/>
        <path d="M5 9.7S6.8 7.5 12 7.5s7 2.2 7 2.2"/>
        <path d="M8.5 13.2S9.9 11.5 12 11.5s3.5 1.7 3.5 1.7"/>
        <circle cx="12" cy="17" r="1.5" fill="#c66a30" stroke="none"/>
        <line x1="2" y1="2" x2="22" y2="22" stroke="#c66a30"/>
      </svg>
    </div>
    <h1>ไม่มีสัญญาณอินเทอร์เน็ต</h1>
    <p>ตรวจสอบการเชื่อมต่อ WiFi หรือข้อมูลมือถือของคุณ แล้วลองใหม่อีกครั้ง</p>
    <button class="btn" onclick="location.reload()">ลองโหลดใหม่</button>
    <p class="hint">การจองที่บันทึกไว้จะพร้อมใช้งานเมื่อคุณกลับมาออนไลน์</p>
  </div>
</body>
</html>
